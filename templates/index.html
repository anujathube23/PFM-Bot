<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Finance Advisor</title>
<style>
:root{--ink:#14213d;--paper:#f3f6f8;--card:#fff;--line:#d8e0e6;--accent:#0f766e;--warn:#b45309;--bad:#b42318;--muted:#5b6b7a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 28px;background:var(--ink);color:#fff}
h1{font:600 1.35rem Georgia,serif;margin:0}
h2{font:600 1.05rem Georgia,serif;margin:0 0 12px}
main{max-width:1080px;margin:24px auto;padding:0 20px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat span{display:block;color:var(--muted);font-size:.85rem}
.stat b{font:600 1.7rem Georgia,serif}
.pos{color:var(--accent)}.neg{color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
select,input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
form .wide{grid-column:1/-1}
label.check{display:flex;gap:6px;align-items:center;font-size:.9rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.track{background:#e6ecf0;height:10px;border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--accent)}.fill.over{background:var(--warn)}
.insight p,.insight li{max-width:70ch}
.msg{color:var(--muted)}.err{color:var(--bad)}
ul{padding-left:20px}
</style>
</head>
<body>
<header>
  <h1>Personal Finance Advisor</h1>
  <div>
    <select id="userSelect" aria-label="Choose profile"></select>
    <input type="month" id="month" aria-label="Month">
    <button class="ghost" id="newUserBtn" style="color:#fff;border-color:#fff">New profile</button>
  </div>
</header>
<main>
  <section class="stats card" id="stats" aria-live="polite"><p class="msg">Create a profile to get started.</p></section>
  <div class="cols">
    <section class="card"><h2>Spending by category</h2><div id="categories"><p class="msg">No expenses this month yet.</p></div></section>
    <section class="card">
      <h2>Add a record</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <form id="recordForm"></form>
      <p id="formMsg" class="msg" role="status"></p>
    </section>
  </div>
  <section class="card insight">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>Advisor insights</h2><button id="analyzeBtn">Analyze my month</button>
    </div>
    <div id="insights" aria-live="polite"><p class="msg">Run the analysis to get a budget plan and saving suggestions.</p></div>
  </section>
</main>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
